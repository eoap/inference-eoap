name: Inference release preparation
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-notebooks.txt
      - run: python -m pytest tests -q
      - run: python scripts/cwl-docs.py --validate --output acceptance/contracts
      - uses: actions/upload-artifact@v4
        with:
          name: inference-contracts
          path: acceptance/contracts
  containers:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [stage-in, sen2cog, inference]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file tile-based-classification/command-line-tools/${{ matrix.step }}/Dockerfile --tag inference-${{ matrix.step }}:${{ github.sha }} .
      - run: docker run --rm inference-${{ matrix.step }}:${{ github.sha }} python -c "import rasterio, pystac, onnxruntime"
# Stable publication is intentionally gated until authenticated notebook acceptance
# and immutable release-artifact validation are recorded for the release commit.
