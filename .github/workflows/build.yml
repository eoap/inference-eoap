name: build
on:
  push:
    branches:
    - main

    paths:
    # Only rebuild website when apps have changed
    - 'tile-based-classification/**'
    - .github/**
    - docs/**
    - cwl-workflow/*.cwl
    - codemeta.json
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Bootstrap patched pip and CA bundle
      shell: bash
      run: |
        python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install --upgrade "certifi>=2026.10.19"
        python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
        python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
        echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
        echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
    - run: pip install cwltool
    - run: cwltool --validate cwl-workflow/tile-based-classification.cwl
    - run: cwltool --validate cwl-workflow/stage-and-cog.cwl

  version:
    needs: validate

    runs-on: ubuntu-latest

    outputs:

      app-version: ${{ steps.set-version.outputs.version }}

    steps:
    - uses: actions/checkout@v7
    - run: echo "APP_VERSION=$(cat codemeta.json | jq -r .version )" >> $GITHUB_ENV
    - run: echo app version is $APP_VERSION
    - id: set-version
      run: echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  container-build:

    needs: version

    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: [stage-in, sen2cog, inference]

    steps:
    - uses: actions/checkout@v7
    - run: echo version ${{needs.version.outputs.app-version}}
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image
      run: |
        IMAGE_ID=ghcr.io/eoap/inference-eoap/${{ matrix.step }}
        docker build --pull --no-cache tile-based-classification/command-line-tools/${{ matrix.step }} --file tile-based-classification/command-line-tools/${{ matrix.step }}/Dockerfile --tag ${{ matrix.step }}
        docker tag ${{ matrix.step }} $IMAGE_ID:${{needs.version.outputs.app-version}}
        docker push $IMAGE_ID:${{needs.version.outputs.app-version}}

  create-release:

    needs:
    - container-build
    - version

    runs-on: ubuntu-latest

    outputs:

      upload_url: ${{ steps.set-upload-url.outputs.upload_url }}

    steps:
    - name: release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: ${{needs.version.outputs.app-version}}
        tag_name: ${{needs.version.outputs.app-version}}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - id: set-upload-url
      run: echo "upload_url=${{ steps.create_release.outputs.upload_url }}" >> "$GITHUB_OUTPUT"

  publish-artifacts:

    needs:
    - create-release
    - version

    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: ["stage-and-cog", "tile-based-classification"]

    steps:
    - uses: actions/checkout@v7
    - run: |
        for step in stage-in sen2cog inference 
        do
          tag="ghcr.io/eoap/inference-eoap/${step}:${{needs.version.outputs.app-version}}"
          docker pull ${tag}
          shatag=$( docker inspect ${tag} | yq -r '.[0]["RepoDigests"][0]' )
          for cwl in $(ls cwl-workflow/*.cwl)
          do
            s="${step}" t="${shatag}" yq -i eval '(.$graph[] | select (.id == env(s)) ).hints.DockerRequirement.dockerPull = env(t)' $cwl
          done
        done
    - run: |
        for cwl in $(ls cwl-workflow/*.cwl)
        do
          r=$( cat codemeta.json | jq -r ".codeRepository" ) yq -i eval '."s:codeRepository" = {"URL" : env(r)}' $cwl
          v="${{needs.version.outputs.app-version}}" yq -i eval '."s:softwareVersion" = env(v)' $cwl
          n=$(cat codemeta.json | jq -r '(.author[0].givenName + " " + .author[0].familyName)') \
          e=$(cat codemeta.json | jq -r '.author[0].email') \
          a=$(cat codemeta.json | jq -r '.author[0].affiliation["name"]') \
          yq eval -i  '."s:author" += [{"class": "s:Person", "s.name": env(n), "s.email": env(e), "s.affiliation": env(a)}]' $cwl
        done
    - name: Cleanup downloads folder
      run: rm -rf downloads/*
    - run: |
        mkdir downloads
        for cwl in "stage-and-cog" "tile-based-classification"
        do
          cp cwl-workflow/${cwl}.cwl downloads/${cwl}.${{needs.version.outputs.app-version}}.cwl
        done
    - uses: actions/upload-artifact@v4
      with:
        name: application-package-${{matrix.step}}
        path: downloads
    - name: upload linux artifact 1
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{needs.create-release.outputs.upload_url}}
        asset_path: downloads/${{matrix.step}}.${{needs.version.outputs.app-version}}.cwl
        asset_name: ${{matrix.step}}.${{needs.version.outputs.app-version}}.cwl
        asset_content_type: text/yaml