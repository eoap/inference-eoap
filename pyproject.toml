[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "eoap-inference-eoap"
version = "2.0.0"
description = "Authenticated Sentinel-2 staging, COG conversion and ONNX classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-SA-4.0"
dependencies = ["pystac==1.15.2", "click==8.5.0", "loguru==0.7.3", "requests==2.34.2", "numpy==2.5.4", "rasterio==1.5.2", "onnx==1.23.2", "onnxruntime==1.31.0", "rio-stac==0.12.0", "stactools-sentinel2==0.8.0", "boto3==1.43.111"]

[project.urls]
Documentation = "https://eoap.github.io/inference-eoap/"
Source = "https://github.com/eoap/inference-eoap"
Issues = "https://github.com/eoap/inference-eoap/issues"

[project.scripts]
stage-sentinel2 = "eoap_inference.stage_in:stage"
sentinel2-to-cog = "eoap_inference.sen2cog:to_cog"
classify-sentinel2 = "eoap_inference.inference:predict"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eoap_inference"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tile-based-classification", "/docs", "/scripts", "/tests", "/requirements", "/README.md", "/LICENSE.md", "/pyproject.toml"]

[tool.hatch.envs.dev]
template = "dev"
python = "3.12"
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.dev.scripts]
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "ruff format --check src tests"
lint-check = "ruff check src tests"
typecheck = "mypy src"
security = "bandit -r src -ll"

[tool.hatch.envs.test]
template = "dev"
[tool.hatch.envs.test.scripts]
test = ["bootstrap", "pytest -q {args}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true
